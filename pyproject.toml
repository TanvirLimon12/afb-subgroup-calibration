[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-robustafb"
version = "0.1.0"
description = "Foundation-model candidate verification, group-robust training, and calibrated selective prediction for acid-fast bacilli detection in raw Ziehl-Neelsen microscopy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "numpy>=1.24", "scipy>=1.10",
  "scikit-learn>=1.3", "scikit-image>=0.21", "Pillow>=9.5", "PyYAML>=6.0",
  "matplotlib>=3.7", "imagehash>=4.3", "opencv-python-headless>=4.8", "gdown>=5.0",
]

[project.optional-dependencies]
dino = ["xformers"]
sam = ["micro-sam", "segment-anything"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
afb-synthesize = "scripts.make_synthetic:main"
afb-convert-yolo = "scripts.convert_yolo:main"
afb-download-znsm = "scripts.download_znsm:main"
afb-ingest-znsm = "scripts.ingest_znsm:main"
afb-audit = "scripts.run_audit:main"
afb-train-detector = "scripts.train_detector:main"
afb-train-verifier = "scripts.train_verifier:main"
afb-experiment = "scripts.run_experiment:main"
afb-run-seed = "scripts.run_seed:main"

[tool.setuptools.packages.find]
include = ["fm_robustafb*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
